services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Compose defaults; anything in .env wins.
      DATABASE_URL: sqlite+aiosqlite:////app/data/jobs.db
      SCHEDULER_ENABLED: "true"
      SCRAPE_INTERVAL_HOURS: "6"
    volumes:
      - job_data:/app/data
    restart: unless-stopped
    # Chromium needs more than Docker's default 64MB of shared memory.
    shm_size: "1gb"

volumes:
  job_data:
