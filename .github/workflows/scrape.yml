# Scheduled scrape.
#
# The GitHub-hosted runner is the free tier's best compute: 4 vCPU / 16GB RAM,
# already has the Chromium system libraries, and dies after the job. That fits a
# scraper far better than a 512MB always-on free web dyno, which cannot render a
# page. It writes into the same Neon Postgres the Render API reads from.
#
# Minutes are free and unmetered on public repos. On a PRIVATE repo you get
# 2,000 min/month - a 6-hourly run at ~10 min each is ~1,200, which fits, but
# drop to "17 2,14 * * *" if you add sources or raise the page counts.
name: scrape

on:
  schedule:
    # 02:17, 08:17, 14:17, 20:17 UTC. Off the hour on purpose: GitHub queues
    # cron jobs and the top of the hour is the most contended slot.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Space separated (naukri linkedin). Blank = configured default."
        required: false
        default: ""
      limit:
        description: "Cap the number of search queries. Blank = all, 5 = smoke test."
        required: false
        default: ""

# A scrape holds a run lock in the database. Never start a second one.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: INFO
      ENVIRONMENT: production
      # This workflow IS the schedule; the process must not start its own timer.
      SCHEDULER_ENABLED: "false"
      PLAYWRIGHT_FALLBACK: "true"
      PLAYWRIGHT_HEADLESS: "true"
      # Both the API server and this workflow may run maintenance; a run that
      # collides simply finds the other one's rows already retired.
      MAINTENANCE_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scrape.txt

      - name: Install dependencies
        run: pip install -r requirements-scrape.txt

      # Chromium is ~450MB; caching it turns a 60s download into a 5s restore.
      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-scrape.txt') }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      # A cache hit restores the browser but not the apt libraries it links
      # against, which live outside the cached path.
      - name: Install browser system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Scrape
        env:
          INPUT_SOURCES: ${{ inputs.sources }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          # Written as `if` blocks, not `[ … ] && …`: the runner uses `bash -e`,
          # where a false test on its own line aborts the step.
          ARGS=""
          if [ -n "$INPUT_SOURCES" ]; then ARGS="$ARGS --sources $INPUT_SOURCES"; fi
          if [ -n "$INPUT_LIMIT" ]; then ARGS="$ARGS --limit $INPUT_LIMIT"; fi
          # 45 minutes clears runs abandoned by a previous timed-out job without
          # touching one a live API server may have started minutes ago.
          python main.py scrape --stale-after 45 $ARGS

      # Cheap and idempotent. Re-applies the current taxonomy and search format
      # to rows collected under older rules, which would otherwise stay wrong
      # until re-scraped - and a row that no longer qualifies never is.
      - name: Reindex and reclassify
        if: success()
        run: python main.py reindex

      # Retires postings that stopped appearing in results (stale_after_days)
      # and ones the board is no longer serving, then deletes what has been
      # retired long enough. Run here rather than through the API because this
      # runner already holds the database credentials, and because the link
      # probes should come from the address that just scraped the same boards
      # rather than from the API host.
      - name: Retire and delete expired postings
        if: success()
        run: python main.py maintain

      - name: Show database totals
        if: always()
        run: python main.py stats
